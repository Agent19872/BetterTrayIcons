name: Sync README Badge

on:
  push:
    branches: [main]
    paths: [metadata.json]

permissions:
  contents: write

jobs:
  sync-badge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the GNOME Shell badge from metadata.json
        run: |
          # Fail loudly if the badge ever gets renamed, otherwise this would
          # silently stop syncing without anyone noticing
          if ! grep -q 'badge/GNOME%20Shell-' README.md; then
            echo "::error::GNOME Shell badge not found in README.md"
            exit 1
          fi

          # join with %2F so shields renders "49/50", the message segment
          # sits between the fixed label and the fixed color
          versions=$(jq -r '.["shell-version"] | join("%2F")' metadata.json)
          sed -i -E "s#(badge/GNOME%20Shell-)[^-]*(-333333)#\1${versions}\2#" README.md

      - name: Commit if the badge changed
        run: |
          if git diff --quiet README.md; then
            echo "Badge already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: sync gnome shell badge with metadata.json"
          git push
